<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="son-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191a1f"/>
      <stop offset="48%" stop-color="#2c2e34"/>
      <stop offset="100%" stop-color="#1e2027"/>
    </linearGradient>
    <radialGradient id="son-cyan-glow" cx="72%" cy="44%" r="44%">
      <stop offset="0%" stop-color="#78dce8" stop-opacity="0.26"/>
      <stop offset="45%" stop-color="#ab9df2" stop-opacity="0.12"/>
      <stop offset="85%" stop-color="#2c2e34" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="son-rose-glow" cx="22%" cy="76%" r="44%">
      <stop offset="0%" stop-color="#ff6188" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ab9df2" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#2c2e34" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="son-facet-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#484c5c"/>
      <stop offset="100%" stop-color="#272932"/>
    </linearGradient>
    <linearGradient id="son-facet-b" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3c404f"/>
      <stop offset="100%" stop-color="#1f2128"/>
    </linearGradient>
    <linearGradient id="son-facet-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78dce8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#2c2e34" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="son-facet-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6188" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2c2e34" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#son-bg)"/>
  <rect width="1920" height="1080" fill="url(#son-cyan-glow)"/>
  <rect width="1920" height="1080" fill="url(#son-rose-glow)"/>
  <!-- Diagonal crystalline refraction rays -->
  <g opacity="0.24">
    <polygon points="1340,390 1920,120 1920,210 1370,430" fill="#78dce8"/>
    <polygon points="1340,470 1920,540 1920,660 1310,520" fill="#ff6188"/>
    <polygon points="1220,520 560,1080 410,1080 1160,480" fill="#ab9df2" opacity="0.7"/>
    <polygon points="320,820 820,420 860,450 380,870" fill="#78dce8" opacity="0.45"/>
  </g>
  <!-- Background polygonal wireframe crystal lattice -->
  <g stroke="#78dce8" stroke-width="0.9" opacity="0.16">
    <polygon points="1350,150 1630,360 1510,720 1180,680 1070,340"/>
    <line x1="1350" y1="150" x2="1510" y2="720"/>
    <line x1="1070" y1="340" x2="1630" y2="360"/>
    <line x1="1180" y1="680" x2="1630" y2="360"/>
  </g>
  <!-- Hero Right Crystal Spire Cluster -->
  <g transform="translate(1360, 480)">
    <!-- Tall central ice-slate crystal spire -->
    <polygon points="0,-310 -125,-60 0,240" fill="url(#son-facet-a)" stroke="#78dce8" stroke-width="1.5" stroke-opacity="0.72"/>
    <polygon points="0,-310 125,-60 0,240" fill="url(#son-facet-b)" stroke="#ff6188" stroke-width="1.4" stroke-opacity="0.65"/>
    <polygon points="0,-310 -125,-60 0,-18" fill="url(#son-facet-cyan)"/>
    <polygon points="0,-310 125,-60 0,-18" fill="url(#son-facet-rose)" opacity="0.75"/>
    <line x1="0" y1="-310" x2="0" y2="240" stroke="#e2e4e5" stroke-width="1.4" opacity="0.52"/>
    <!-- Left angled crystal shard -->
    <polygon points="-210,-120 -290,95 -95,280 -80,45" fill="url(#son-facet-a)" stroke="#ab9df2" stroke-width="1.3" stroke-opacity="0.62"/>
    <polygon points="-210,-120 -80,45 -185,120" fill="url(#son-facet-cyan)" opacity="0.8"/>
    <!-- Right angled crystal shard -->
    <polygon points="225,-145 315,85 110,310 95,30" fill="url(#son-facet-b)" stroke="#ff6188" stroke-width="1.4" stroke-opacity="0.7"/>
    <polygon points="225,-145 95,30 215,95" fill="url(#son-facet-rose)"/>
    <!-- Foreground sharp crystal cluster base -->
    <polygon points="-145,140 20,75 185,195 140,420 -210,420" fill="#23252d" stroke="#78dce8" stroke-width="1.2" stroke-opacity="0.45"/>
    <polygon points="20,75 185,195 40,260" fill="#78dce8" opacity="0.16"/>
  </g>
  <!-- Secondary Left-Bottom Faceted Crystal Outcrop -->
  <g transform="translate(260, 860)">
    <polygon points="0,-240 -140,40 -10,220 95,-15" fill="url(#son-facet-a)" stroke="#ff6188" stroke-width="1.4" stroke-opacity="0.65"/>
    <polygon points="0,-240 95,-15 -15,35" fill="url(#son-facet-rose)"/>
    <polygon points="120,-135 235,95 95,220 25,20" fill="url(#son-facet-b)" stroke="#78dce8" stroke-width="1.3" stroke-opacity="0.6"/>
    <polygon points="120,-135 25,20 125,65" fill="url(#son-facet-cyan)"/>
  </g>
  <!-- Floating diamond micro-shards & specular crystal glints -->
  <g>
    <polygon points="940,235 954,255 940,275 926,255" fill="#78dce8" opacity="0.48"/>
    <polygon points="1050,650 1062,668 1050,686 1038,668" fill="#ff6188" opacity="0.46"/>
    <polygon points="480,310 490,324 480,338 470,324" fill="#ab9df2" opacity="0.45"/>
    <polygon points="1720,380 1732,398 1720,416 1708,398" fill="#ffd866" opacity="0.42"/>
    <path d="M 1360 170 L 1363 158 L 1366 170 L 1378 173 L 1366 176 L 1363 188 L 1360 176 L 1348 173 Z" fill="#e2e4e5" opacity="0.9"/>
    <path d="M 260 620 L 262 612 L 264 620 L 272 622 L 264 624 L 262 632 L 260 624 L 252 622 Z" fill="#ff6188" opacity="0.88"/>
  </g>
</svg>
