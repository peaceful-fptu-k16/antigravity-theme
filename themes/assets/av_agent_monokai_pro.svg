<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="mpa-bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#3e3a40"/>
      <stop offset="62%" stop-color="#2d2a2e"/>
      <stop offset="100%" stop-color="#1b191c"/>
    </radialGradient>
    <linearGradient id="mpa-prism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd866"/>
      <stop offset="50%" stop-color="#ff6188"/>
      <stop offset="100%" stop-color="#78dce8"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#mpa-bg)" stroke="url(#mpa-prism)" stroke-width="2.2"/>
  <!-- Spectral output beams -->
  <line x1="36" y1="28" x2="55" y2="20" stroke="#ffd866" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="37" y1="32" x2="56" y2="32" stroke="#ff6188" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="36" y1="36" x2="55" y2="44" stroke="#78dce8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="9" y1="32" x2="23" y2="32" stroke="#fcfcfa" stroke-width="1.6" opacity="0.85"/>
  <!-- Glowing Bauhaus prism core -->
  <polygon points="32,14 15,44 49,44" fill="#2d2a2e" stroke="url(#mpa-prism)" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,21 22,40 42,40" fill="url(#mpa-prism)" opacity="0.28"/>
  <circle cx="32" cy="33" r="3.4" fill="#f8f8f2"/>
</svg>
