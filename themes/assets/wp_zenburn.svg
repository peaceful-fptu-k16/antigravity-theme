<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="zen-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#353535"/>
      <stop offset="48%" stop-color="#3f3f3f"/>
      <stop offset="100%" stop-color="#333331"/>
    </linearGradient>
    <radialGradient id="zen-moon-halo" cx="76%" cy="22%" r="38%">
      <stop offset="0%" stop-color="#f0dfaf" stop-opacity="0.2"/>
      <stop offset="48%" stop-color="#8cd0d3" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3f3f3f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="zen-sage-mist" cx="18%" cy="26%" r="40%">
      <stop offset="0%" stop-color="#7f9f7f" stop-opacity="0.14"/>
      <stop offset="65%" stop-color="#3f3f3f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="zen-stone-a" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#585750"/>
      <stop offset="55%" stop-color="#3b3b38"/>
      <stop offset="100%" stop-color="#2a2a28"/>
    </linearGradient>
    <linearGradient id="zen-stone-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#504f49"/>
      <stop offset="100%" stop-color="#292927"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#zen-bg)"/>
  <rect width="1920" height="1080" fill="url(#zen-moon-halo)"/>
  <rect width="1920" height="1080" fill="url(#zen-sage-mist)"/>
