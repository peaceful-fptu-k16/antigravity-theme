  <path d="M 0 785 Q 240 695 520 755 T 1080 745 T 1640 725 L 1920 765 L 1920 1080 L 0 1080 Z" fill="url(#gvl-hill2)" opacity="0.74"/>
  <!-- Delicate woodblock contour lines on hills -->
  <path d="M 40 825 Q 260 740 520 795 T 1090 785 T 1640 765" stroke="#af3a03" stroke-width="1.3" opacity="0.22"/>
  <path d="M 0 878 Q 310 790 680 860 T 1420 835 T 1920 870 L 1920 1080 L 0 1080 Z" fill="url(#gvl-hill3)" opacity="0.56"/>
  <!-- Foreground warm earth framing & sage desert flora -->
  <path d="M 0 955 Q 340 895 760 965 T 1560 940 T 1920 960 L 1920 1080 L 0 1080 Z" fill="#9c5a30" opacity="0.34"/>
  <g fill="#427b58" opacity="0.48">
    <!-- Left agave rosette -->
    <path d="M 110 1040 Q 82 955 46 920 Q 95 955 122 1030 Z"/>
    <path d="M 122 1040 Q 118 935 124 888 Q 138 940 136 1038 Z"/>
    <path d="M 134 1040 Q 164 958 206 930 Q 158 972 146 1040 Z"/>
    <!-- Right juniper tuft -->
    <path d="M 1765 1042 Q 1738 962 1705 935 Q 1752 968 1778 1038 Z"/>
    <path d="M 1780 1042 Q 1784 948 1794 908 Q 1802 958 1794 1042 Z"/>
    <path d="M 1792 1042 Q 1825 968 1862 945 Q 1815 985 1804 1042 Z"/>
  </g>
