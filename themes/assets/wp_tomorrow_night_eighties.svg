<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="tne-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="56%" stop-color="#2d2d2d"/>
      <stop offset="100%" stop-color="#222224"/>
    </linearGradient>
    <radialGradient id="tne-sky-glow" cx="68%" cy="34%" r="44%">
      <stop offset="0%" stop-color="#6699cc" stop-opacity="0.22"/>
      <stop offset="46%" stop-color="#cc99cc" stop-opacity="0.13"/>
      <stop offset="85%" stop-color="#2d2d2d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tne-warm-glow" cx="28%" cy="56%" r="36%">
      <stop offset="0%" stop-color="#f99157" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#f2777a" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2d2d2d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tne-grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6699cc" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#cc99cc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2d2d2d" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#tne-bg)"/>
  <rect width="1920" height="1080" fill="url(#tne-sky-glow)"/>
  <rect width="1920" height="1080" fill="url(#tne-warm-glow)"/>
  <!-- Starlight field & constellation dots -->
  <g fill="#cccccc" opacity="0.65">
    <circle cx="164" cy="112" r="1.6"/><circle cx="318" cy="184" r="1.3"/><circle cx="486" cy="96" r="2"/>
    <circle cx="672" cy="154" r="1.4"/><circle cx="884" cy="86" r="1.7"/><circle cx="1090" cy="138" r="1.4"/>
    <circle cx="1490" cy="116" r="1.8"/><circle cx="1690" cy="168" r="1.5"/><circle cx="1824" cy="92" r="1.3"/>
    <circle cx="240" cy="312" r="1.4"/><circle cx="564" cy="284" r="1.6"/><circle cx="812" cy="242" r="1.2"/>
  </g>
  <!-- Twin 1980s cassette-futurism orbital rings upper-right -->
  <g transform="translate(1340, 315)">
    <circle r="158" stroke="#6699cc" stroke-width="1.5" opacity="0.34"/>
    <circle r="118" stroke="#cc99cc" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.4"/>
    <circle r="72" fill="#393939" opacity="0.52" stroke="#66cccc" stroke-width="1.3"/>
    <circle r="24" fill="#2d2d2d" stroke="#ffcc66" stroke-width="1.6"/>
    <!-- 6 cassette reel spokes -->
    <g stroke="#cccccc" stroke-width="1.6" opacity="0.45">
      <line x1="0" y1="-34" x2="0" y2="-56"/><line x1="0" y1="34" x2="0" y2="56"/>
      <line x1="30" y1="-17" x2="48" y2="-28"/><line x1="-30" y1="17" x2="-48" y2="28"/>
      <line x1="-30" y1="-17" x2="-48" y2="-28"/><line x1="30" y1="17" x2="48" y2="28"/>
    </g>
  </g>
  <!-- Subtle low-poly retro horizon hills -->
  <path d="M 0 635 L 180 545 L 365 605 L 570 520 L 780 615 L 990 555 L 1160 635 Z" fill="#363636" opacity="0.65"/>
  <!-- Iconic Base16 Cassette-Futurism 7-color Horizon Ribbon Stripes -->
  <g stroke-linecap="round" opacity="0.44">
    <path d="M 0 606 L 1220 606 Q 1345 606 1435 516 L 1920 32" stroke="#f2777a" stroke-width="9"/>
    <path d="M 0 621 L 1235 621 Q 1360 621 1450 531 L 1920 62" stroke="#f99157" stroke-width="9"/>
    <path d="M 0 636 L 1250 636 Q 1375 636 1465 546 L 1920 92" stroke="#ffcc66" stroke-width="9"/>
    <path d="M 0 651 L 1265 651 Q 1390 651 1480 561 L 1920 122" stroke="#99cc99" stroke-width="9"/>
    <path d="M 0 666 L 1280 666 Q 1405 666 1495 576 L 1920 152" stroke="#66cccc" stroke-width="9"/>
    <path d="M 0 681 L 1295 681 Q 1420 681 1510 591 L 1920 182" stroke="#6699cc" stroke-width="9"/>
    <path d="M 0 696 L 1310 696 Q 1435 696 1525 606 L 1920 212" stroke="#cc99cc" stroke-width="9"/>
  </g>
  <!-- Soft Graphite Perspective Starlight Grid below horizon -->
  <g stroke="url(#tne-grid-fade)" stroke-width="1.2">
    <!-- Horizontal receding depth lines -->
    <line x1="0" y1="726" x2="1920" y2="726"/>
    <line x1="0" y1="762" x2="1920" y2="762"/>
    <line x1="0" y1="808" x2="1920" y2="808"/>
    <line x1="0" y1="866" x2="1920" y2="866"/>
    <line x1="0" y1="938" x2="1920" y2="938"/>
    <line x1="0" y1="1024" x2="1920" y2="1024"/>
    <!-- Vanishing perspective rays from center horizon (960, 680) -->
    <line x1="960" y1="705" x2="960" y2="1080"/>
    <line x1="870" y1="705" x2="660" y2="1080"/><line x1="1050" y1="705" x2="1260" y2="1080"/>
    <line x1="780" y1="705" x2="360" y2="1080"/><line x1="1140" y1="705" x2="1560" y2="1080"/>
    <line x1="690" y1="705" x2="60" y2="1080"/><line x1="1230" y1="705" x2="1860" y2="1080"/>
    <line x1="600" y1="705" x2="-240" y2="1080"/><line x1="1320" y1="705" x2="2160" y2="1080"/>
  </g>
  <!-- Crisp retro analog oscilloscope wave upper-left -->
  <path d="M 110 385 L 235 385 L 258 345 L 284 420 L 310 365 L 332 385 L 480 385" stroke="#66cccc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.42"/>
</svg>
