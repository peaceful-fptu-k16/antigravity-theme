<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 38" fill="none">
  <defs>
    <linearGradient id="mps-arc" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#78dce8" stop-opacity="0.22"/>
      <stop offset="36%" stop-color="#ffd866" stop-opacity="0.96"/>
      <stop offset="72%" stop-color="#ff6188" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a9dc76" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="mps-prism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd866"/>
      <stop offset="55%" stop-color="#ff6188"/>
      <stop offset="100%" stop-color="#78dce8"/>
    </linearGradient>
  </defs>
  <path d="M 6 27 Q 62 9 122 25" stroke="url(#mps-arc)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 18 31 Q 64 16 112 29" stroke="#78dce8" stroke-width="0.9" stroke-dasharray="4 3" opacity="0.62"/>
  <!-- Bauhaus studio prism refracting 3 beams -->
  <g transform="translate(80, 18)">
    <line x1="-18" y1="-3" x2="-5" y2="0" stroke="#fcfcfa" stroke-width="1.2" opacity="0.8"/>
    <line x1="5" y1="-2" x2="22" y2="-8" stroke="#ffd866" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="6" y1="0" x2="23" y2="0" stroke="#ff6188" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="5" y1="2" x2="22" y2="8" stroke="#78dce8" stroke-width="1.3" stroke-linecap="round"/>
    <polygon points="0,-9 -9,7 9,7" fill="#383539" stroke="url(#mps-prism)" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="0" cy="1" r="1.6" fill="#ffd866"/>
  </g>
  <!-- Balanced Bauhaus geometric accents left -->
  <circle cx="32" cy="17" r="4.2" stroke="#ffd866" stroke-width="1.25"/>
  <path d="M 32 12.8 A 4.2 4.2 0 0 1 36.2 17 L 32 17 Z" fill="#ff6188"/>
  <rect x="44" y="12.5" width="4.5" height="4.5" fill="#78dce8" opacity="0.9"/>
  <circle cx="113" cy="12" r="1.5" fill="#a9dc76"/>
</svg>
