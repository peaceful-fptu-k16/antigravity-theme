<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 38" fill="none">
  <defs>
    <linearGradient id="gds-sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fabd2f"/>
      <stop offset="55%" stop-color="#fe8019"/>
      <stop offset="100%" stop-color="#cc241d"/>
    </linearGradient>
    <linearGradient id="gds-stripe" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#cc241d" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#fe8019" stop-opacity="0.95"/>
      <stop offset="78%" stop-color="#fabd2f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ebdbb2" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <!-- Triple 70s retro-groove sunset waves -->
  <path d="M 6 26 Q 58 9 122 24" stroke="url(#gds-stripe)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 14 30 Q 60 15 115 28" stroke="#cc241d" stroke-width="1.2" stroke-linecap="round" opacity="0.72"/>
  <path d="M 24 33 Q 63 21 106 31" stroke="#8ec07c" stroke-width="0.95" stroke-linecap="round" opacity="0.65"/>
  <!-- Sliced vinyl rising sun & stepped mesa silhouette -->
  <g transform="translate(82, 22)">
    <path d="M -13 0 A 13 13 0 0 1 13 0 Z" fill="url(#gds-sun)"/>
    <line x1="-12" y1="-3" x2="12" y2="-3" stroke="#282828" stroke-width="1.5"/>
    <line x1="-10" y1="-6.8" x2="10" y2="-6.8" stroke="#282828" stroke-width="1.1"/>
    <path d="M -18 2 L -11 2 L -8 -2.5 L -1 -2.5 L 2 2 L 9 2 L 12 -1.2 L 17 -1.2 L 20 2" stroke="#ebdbb2" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.88"/>
  </g>
  <!-- Retro geometric diamonds -->
  <path d="M 32 16 L 34.5 13 L 37 16 L 34.5 19 Z" fill="#fabd2f" opacity="0.9"/>
  <path d="M 44 13.5 L 45.8 11.5 L 47.6 13.5 L 45.8 15.5 Z" fill="#fe8019" opacity="0.85"/>
  <circle cx="111" cy="14" r="1.5" fill="#b8bb26" opacity="0.9"/>
  <circle cx="20" cy="20" r="1.2" fill="#ebdbb2" opacity="0.75"/>
</svg>
